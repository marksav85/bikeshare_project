name: bikeshare-explorer

services:
  backend:
    image: bikeshare-explorer-backend:${BIKESHARE_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - app-private
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/readyz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  frontend:
    image: bikeshare-explorer-frontend:${BIKESHARE_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      backend:
        condition: service_healthy
    networks:
      app-private: {}
      msd-proxy:
        aliases:
          - bikeshare-explorer-frontend
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1:8080/ || exit 1
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3

networks:
  app-private:
    internal: true
  msd-proxy:
    external: true
    name: msd-proxy
