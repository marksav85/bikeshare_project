<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#0b1326" />
    <meta
      name="description"
      content="Explore historical bike-sharing trip patterns across Chicago, New York City, and Washington."
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Apply the saved theme before React mounts to avoid a flash of the wrong theme. -->
    <script>
      try {
        const theme = localStorage.getItem('bikeshare-theme')
        const selectedTheme = theme === 'light' ? 'light' : 'dark'
        document.documentElement.dataset.theme = selectedTheme
        const themeColor = document.querySelector('meta[name="theme-color"]')
        themeColor?.setAttribute('content', selectedTheme === 'light' ? '#eff2f8' : '#0b1326')
      } catch {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <title>BikeShare Explorer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
